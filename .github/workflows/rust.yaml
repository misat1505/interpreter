name: Rust CI

on:
  pull_request:
    branches:
      - master

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      LLVM_SYS_180_PREFIX: /usr/lib/llvm-18

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 18 + Clang + Polly
        run: |
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18
          sudo apt-get install -y \
            libpolly-18-dev \
            libzstd-dev \
            llvm-18-dev \
            clang-18 \
            lld-18 \
            valgrind

      - name: Verify LLVM tools on PATH
        run: |
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Run Clippy
        run: cargo clippy --lib -p raptor -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release
